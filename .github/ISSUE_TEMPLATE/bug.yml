name: Bug report
description: Report a reproducible problem using synthetic data.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic data only; do not include resumes, credentials or personal information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and ApplyPilot version
